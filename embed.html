<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stream de fibras + código</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #fff; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #code { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  #code .code-token {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #334155; letter-spacing: .02em; will-change: transform, opacity;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="code"></div>
  <script type="module">
    import * as THREE from 'three';
    import { Line2 } from 'three/addons/lines/Line2.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

    // --- Config (valores travados) ---
    const CONFIG = {
      bg: '#ffffff', fogColor: '#ffffff', fogDensity: 0.0016,
      lineCount: 70, lineColor: '#9aa6b8', lineOpacity: 0.9,
      signalCount: 55, signalWidth: 2.0, trail: 18,
      palette: ['#2563eb', '#ec4899', '#f59e0b'],
      codeCount: 80, codeColor: '#334155',
      tokens: ['0', '1', '01', '10', '11', '0x1F', '0xA3', '0xFF', '{ }', '</>', '=>',
        'fn()', 'i++', '&&', '||', '[]', '::', '01010', '0b1', '#!', '...', ';', '%', '$_', '1010', '110', '0x7E'],
      speedGlobal: 0.72, speedMin: 0.07, speedSpan: 1.15,
      segmentCount: 150, curveLength: 50, straightLength: 100, curvePower: 0.8265,
      spreadHeight: 30.33, spreadDepth: 0, waveSpeed: 2.48, waveHeight: 0.145,
      camera: { fov: 45, z: 90 }, maxPixelRatio: 2,
    };
    const positionX = (CONFIG.curveLength - CONFIG.straightLength) / 2;

    // --- Helpers ---
    const randomLane = () => Math.floor(Math.random() * CONFIG.lineCount);
    const randomSpeed = () => CONFIG.speedMin + Math.random() * CONFIG.speedSpan;
    const randomToken = () => CONFIG.tokens[Math.floor(Math.random() * CONFIG.tokens.length)];
    const palette = CONFIG.palette.map((c) => new THREE.Color(c));
    const pickColor = () => palette[Math.floor(Math.random() * palette.length)];
    const WHITE = new THREE.Color(1, 1, 1);
    const tmpColor = new THREE.Color();
    const MAX_OPACITY = 0.92;

    function getPathPoint(t, lane, time, cfg) {
      const totalLen = cfg.curveLength + cfg.straightLength;
      const currentX = -cfg.curveLength + t * totalLen;
      let y = 0, z = 0;
      if (currentX < 0) {
        const spreadFactor = (lane / cfg.lineCount - 0.5) * 2;
        const ratio = (currentX + cfg.curveLength) / cfg.curveLength;
        const shapeFactor = Math.pow((Math.cos(ratio * Math.PI) + 1) / 2, cfg.curvePower);
        y = spreadFactor * cfg.spreadHeight * shapeFactor;
        z = spreadFactor * cfg.spreadDepth * shapeFactor || 0;
        y += Math.sin(time * cfg.waveSpeed + currentX * 0.1 + lane) * cfg.waveHeight * shapeFactor;
      }
      return { x: currentX, y, z };
    }
    const ndcToPixel = (ndcX, ndcY, w, h) => ({ x: (ndcX * 0.5 + 0.5) * w, y: (-ndcY * 0.5 + 0.5) * h });
    const codeOpacity = (p) => (p < 0.08 ? p / 0.08 : p > 0.85 ? Math.max(0, (1 - p) / 0.15) : 1);
    const scaleForViewport = (width) => (width < 768 ? 0.6 : 1);

    // --- Cena ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.bg);
    scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);
    const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, 1, 1, 1000);
    camera.position.set(0, 0, CONFIG.camera.z);
    camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.maxPixelRatio));
    const stage = document.getElementById('stage');
    stage.appendChild(renderer.domElement);
    const group = new THREE.Group();
    group.position.set(positionX, 0, 0);
    scene.add(group);
    const scale = scaleForViewport(window.innerWidth);

    // --- Linhas de fundo ---
    const bgMaterial = new THREE.LineBasicMaterial({ color: CONFIG.lineColor, transparent: true, opacity: CONFIG.lineOpacity, depthWrite: false });
    const lines = [];
    for (let i = 0; i < CONFIG.lineCount; i++) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(CONFIG.segmentCount * 3), 3));
      const line = new THREE.Line(g, bgMaterial); line.userData.id = i;
      group.add(line); lines.push(line);
    }
    function updateLines(time) {
      for (const line of lines) {
        const pos = line.geometry.attributes.position.array; const id = line.userData.id;
        for (let j = 0; j < CONFIG.segmentCount; j++) {
          const p = getPathPoint(j / (CONFIG.segmentCount - 1), id, time, CONFIG);
          pos[j * 3] = p.x; pos[j * 3 + 1] = p.y; pos[j * 3 + 2] = p.z;
        }
        line.geometry.attributes.position.needsUpdate = true;
      }
    }

    // --- Cometas (Line2) ---
    const signalMat = new LineMaterial({ linewidth: CONFIG.signalWidth, vertexColors: true, transparent: true, depthTest: false, depthWrite: false });
    const signals = [];
    for (let i = 0; i < Math.round(CONFIG.signalCount * scale); i++) {
      const geo = new LineGeometry();
      geo.setPositions(new Array(CONFIG.trail * 3).fill(0));
      geo.setColors(new Array(CONFIG.trail * 3).fill(1));
      const line = new Line2(geo, signalMat); line.frustumCulled = false;
      group.add(line);
      signals.push({ line, geo, lane: randomLane(), speed: randomSpeed(), progress: Math.random(), history: [], color: pickColor(), pos: new Array(CONFIG.trail * 3), col: new Array(CONFIG.trail * 3) });
    }
    function updateSignals(time) {
      for (const s of signals) {
        s.progress += s.speed * 0.005 * CONFIG.speedGlobal;
        if (s.progress > 1) { s.progress = Math.random() * 0.1; s.lane = randomLane(); s.history = []; s.color = pickColor(); s.speed = randomSpeed(); }
        s.history.push(getPathPoint(s.progress, s.lane, time, CONFIG));
        if (s.history.length > CONFIG.trail) s.history.shift();
        const h = s.history, n = h.length;
        for (let k = 0; k < CONFIG.trail; k++) {
          const fromHead = (CONFIG.trail - 1) - k; let idx = (n - 1) - fromHead; if (idx < 0) idx = 0;
          const p = h[idx] || h[0];
          s.pos[k * 3] = p.x; s.pos[k * 3 + 1] = p.y; s.pos[k * 3 + 2] = p.z;
          const t = CONFIG.trail > 1 ? k / (CONFIG.trail - 1) : 1;
          tmpColor.copy(WHITE).lerp(s.color, t * t);
          s.col[k * 3] = tmpColor.r; s.col[k * 3 + 1] = tmpColor.g; s.col[k * 3 + 2] = tmpColor.b;
        }
        s.geo.setPositions(s.pos); s.geo.setColors(s.col);
      }
    }

    // --- Código (overlay DOM) ---
    const codeContainer = document.getElementById('code');
    const ndc = new THREE.Vector3();
    const codeParticles = [];
    for (let i = 0; i < Math.round(CONFIG.codeCount * scale); i++) {
      const el = document.createElement('span'); el.className = 'code-token'; el.textContent = randomToken();
      codeContainer.appendChild(el);
      codeParticles.push({ el, lane: randomLane(), speed: randomSpeed(), progress: Math.random() });
    }
    function updateCode(time, w, h) {
      for (const c of codeParticles) {
        c.progress += c.speed * 0.005 * CONFIG.speedGlobal;
        if (c.progress > 1) { c.progress = Math.random() * 0.1; c.lane = randomLane(); c.speed = randomSpeed(); c.el.textContent = randomToken(); }
        const p = getPathPoint(c.progress, c.lane, time, CONFIG);
        ndc.set(p.x + positionX, p.y, p.z).project(camera);
        const px = ndcToPixel(ndc.x, ndc.y, w, h);
        c.el.style.transform = `translate(${px.x.toFixed(1)}px, ${px.y.toFixed(1)}px) translate(-50%,-50%)`;
        c.el.style.opacity = (codeOpacity(c.progress) * MAX_OPACITY).toFixed(2);
      }
    }

    // --- Resize + loop ---
    let view;
    function resize() {
      const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      signalMat.resolution.set(w, h);
      view = { w, h };
    }
    function renderFrame(time) { updateLines(time); updateSignals(time); updateCode(time, view.w, view.h); renderer.render(scene, camera); }
    resize();
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.addEventListener('resize', () => { resize(); if (reduceMotion) renderFrame(0.6); });
    if (reduceMotion) {
      for (let i = 0; i < CONFIG.trail; i++) renderFrame(0.6);
    } else {
      const t0 = performance.now();
      (function animate() { requestAnimationFrame(animate); renderFrame((performance.now() - t0) / 1000); })();
    }
  </script>
</body>
</html>
