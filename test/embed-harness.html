<!DOCTYPE html>

<head>

  <title>Embed harness</title>

    body { margin: 0; font-family: sans-serif; background: #eef; }
    .frame-box { width: 80vw; height: 70vh; margin: 6vh auto; border: 2px dashed #88a; background: #fff; }

  </div>
</body>
</html>
